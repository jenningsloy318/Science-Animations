<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Science Animations for Kids — site icon: atom with three orbits -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131d3a"/>
      <stop offset="1" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#ffedb0"/>
      <stop offset="0.55" stop-color="#e8b84b"/>
      <stop offset="1" stop-color="#a9781f"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- faint stars, echoing the hub's starfield -->
  <circle cx="14" cy="12" r="1"   fill="#ffffff" opacity=".55"/>
  <circle cx="52" cy="16" r="0.8" fill="#ffffff" opacity=".4"/>
  <circle cx="50" cy="50" r="1"   fill="#ffffff" opacity=".45"/>
  <circle cx="12" cy="47" r="0.7" fill="#ffffff" opacity=".35"/>

  <!-- three orbital rings in the card-accent colors -->
  <g fill="none" stroke-width="2.6" stroke-linecap="round">
    <ellipse cx="32" cy="32" rx="21" ry="8.5" stroke="#38bdf8" opacity=".9"  transform="rotate(0 32 32)"/>
    <ellipse cx="32" cy="32" rx="21" ry="8.5" stroke="#a78bfa" opacity=".9"  transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="32" rx="21" ry="8.5" stroke="#34d399" opacity=".9"  transform="rotate(120 32 32)"/>
  </g>

  <!-- electrons riding the orbits -->
  <circle cx="53"   cy="32"   r="2.7" fill="#7dd3fc"/>
  <circle cx="21.5" cy="13.8" r="2.7" fill="#c4b5fd"/>
  <circle cx="33.1" cy="44.8" r="2.7" fill="#6ee7b7"/>

  <!-- nucleus -->
  <circle cx="32" cy="32" r="6.5" fill="url(#core)"/>
</svg>
